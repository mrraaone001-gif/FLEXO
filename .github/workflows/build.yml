
name: Build FLEXO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          set -e
          ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)
          test -n "$ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Build Android APK
        run: |
          set -e
          BUILD_FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Android Gradle settings file not found"
            exit 1
          fi
          cd "$(dirname "$BUILD_FILE")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLEXO-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
