
name: Build FLEXO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -type f -iname '*.zip' \
            -not -path './.git/*' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          GRADLEW=$(find project -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper not found."
            find project -maxdepth 5 -type f
            exit 1
          fi

          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload FLEXO APK
        uses: actions/upload-artifact@v4
        with:
          name: FLEXO-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
